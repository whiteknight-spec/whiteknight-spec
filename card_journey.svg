<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" height="100%">
  <defs>
    <!-- 3D Bevel & Emboss Filter -->
    <filter id="embossBevel" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1.5" dy="-1.5" stdDeviation="0.5" flood-color="#FFFBEB" flood-opacity="0.8" />
      <feDropShadow dx="2" dy="2.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <filter id="cyberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="metallicSkull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F4F6" />
      <stop offset="40%" stop-color="#D1D5DB" />
      <stop offset="80%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>

    <linearGradient id="circuitTrace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Outer Card -->
  <rect x="1" y="1" width="848" height="338" rx="16" fill="#120d08" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- 3D EMBOSSED FUTURE SKULL (LEFT FLANK) -->
  <g transform="translate(120, 36)" filter="url(#embossBevel)">
    <!-- Crossbones -->
    <line x1="-18" y1="-18" x2="18" y2="18" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" />
    <line x1="18" y1="-18" x2="-18" y2="18" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" />
    <!-- Metallic Skull Head -->
    <circle cx="0" cy="-2" r="14" fill="url(#metallicSkull)" stroke="#374151" stroke-width="1" />
    <!-- Jaw -->
    <rect x="-7" y="8" width="14" height="8" rx="2" fill="url(#metallicSkull)" stroke="#374151" stroke-width="1" />
    <line x1="-3" y1="8" x2="-3" y2="16" stroke="#374151" stroke-width="0.8" />
    <line x1="0" y1="8" x2="0" y2="16" stroke="#374151" stroke-width="0.8" />
    <line x1="3" y1="8" x2="3" y2="16" stroke="#374151" stroke-width="0.8" />
    <!-- Left Normal Eye Socket -->
    <ellipse cx="-5" cy="-1" rx="3.5" ry="4" fill="#111827" />
    <!-- Right CYBER EYE (Future Glowing Gold) -->
    <ellipse cx="5" cy="-1" rx="3.5" ry="4" fill="#111827" />
    <circle cx="5" cy="-1" r="2.5" fill="#F59E0B" filter="url(#cyberGlow)" />
    <circle cx="5" cy="-1" r="1" fill="#FFFBEB" />
    <!-- Etched Cyber Circuit on Forehead -->
    <path d="M-8,-9 L-3,-9 L0,-5 L6,-5" stroke="url(#circuitTrace)" stroke-width="1" fill="none" />
    <circle cx="6" cy="-5" r="1.2" fill="#F59E0B" />
  </g>

  <!-- Title -->
  <text x="425" y="38" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5" font-weight="bold" fill="#FBBF24" letter-spacing="2">🧭 NAVIGATING THE GRAND LINE (JOURNEY FLOW)</text>

  <!-- 3D EMBOSSED FUTURE SKULL (RIGHT FLANK) -->
  <g transform="translate(730, 36)" filter="url(#embossBevel)">
    <!-- Crossbones -->
    <line x1="-18" y1="-18" x2="18" y2="18" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" />
    <line x1="18" y1="-18" x2="-18" y2="18" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" />
    <!-- Metallic Skull Head -->
    <circle cx="0" cy="-2" r="14" fill="url(#metallicSkull)" stroke="#374151" stroke-width="1" />
    <!-- Jaw -->
    <rect x="-7" y="8" width="14" height="8" rx="2" fill="url(#metallicSkull)" stroke="#374151" stroke-width="1" />
    <line x1="-3" y1="8" x2="-3" y2="16" stroke="#374151" stroke-width="0.8" />
    <line x1="0" y1="8" x2="0" y2="16" stroke="#374151" stroke-width="0.8" />
    <line x1="3" y1="8" x2="3" y2="16" stroke="#374151" stroke-width="0.8" />
    <!-- Right Normal Eye Socket -->
    <ellipse cx="5" cy="-1" rx="3.5" ry="4" fill="#111827" />
    <!-- Left CYBER EYE (Future Glowing Gold) -->
    <ellipse cx="-5" cy="-1" rx="3.5" ry="4" fill="#111827" />
    <circle cx="-5" cy="-1" r="2.5" fill="#F59E0B" filter="url(#cyberGlow)" />
    <circle cx="-5" cy="-1" r="1" fill="#FFFBEB" />
    <!-- Etched Cyber Circuit on Forehead -->
    <path d="M8,-9 L3,-9 L0,-5 L-6,-5" stroke="url(#circuitTrace)" stroke-width="1" fill="none" />
    <circle cx="-6" cy="-5" r="1.2" fill="#F59E0B" />
  </g>

  <!-- Step 1: East Blue -->
  <rect x="175" y="58" width="500" height="32" rx="6" fill="#000000" fill-opacity="0.6" stroke="#D97706" stroke-opacity="0.45" stroke-width="1.2" filter="url(#embossBevel)" />
  <text x="425" y="79" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#FCD34D">⚓ East Blue ➔ Circuits &amp; EEE Core Logic</text>

  <!-- Down Arrow 1 -->
  <text x="425" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="bold" fill="#F59E0B">▼</text>

  <!-- Step 2: Reverse Mountain -->
  <rect x="175" y="110" width="500" height="32" rx="6" fill="#000000" fill-opacity="0.6" stroke="#D97706" stroke-opacity="0.45" stroke-width="1.2" filter="url(#embossBevel)" />
  <text x="425" y="131" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#FCD34D">🌊 Reverse Mountain ➔ Python, Data Structures &amp; Algorithms</text>

  <!-- Down Arrow 2 -->
  <text x="425" y="156" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="bold" fill="#F59E0B">▼</text>

  <!-- Step 3: Grand Line -->
  <rect x="175" y="162" width="500" height="32" rx="6" fill="#000000" fill-opacity="0.6" stroke="#D97706" stroke-opacity="0.45" stroke-width="1.2" filter="url(#embossBevel)" />
  <text x="425" y="183" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#FCD34D">📱 Grand Line ➔ Full-Stack Engineering &amp; Flutter Apps</text>

  <!-- Down Arrow 3 -->
  <text x="425" y="208" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="bold" fill="#F59E0B">▼</text>

  <!-- Step 4: New World -->
  <rect x="175" y="214" width="500" height="32" rx="6" fill="#000000" fill-opacity="0.6" stroke="#D97706" stroke-opacity="0.45" stroke-width="1.2" filter="url(#embossBevel)" />
  <text x="425" y="235" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" fill="#FCD34D">🤖 New World ➔ Autonomous AI Agents &amp; LLM Systems</text>

  <!-- Down Arrow 4 -->
  <text x="425" y="260" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="bold" fill="#F59E0B">▼</text>

  <!-- Step 5: Laugh Tale (Highlighted with 3D Gold Bevel) -->
  <rect x="175" y="266" width="500" height="36" rx="6" fill="#F59E0B" fill-opacity="0.22" stroke="#FBBF24" stroke-width="1.5" filter="url(#embossBevel)" />
  <text x="425" y="289" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="bold" fill="#FEF08A">👑 Laugh Tale ➔ Scalable High-Performance Systems 🚀</text>
</svg>