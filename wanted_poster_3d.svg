<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 620" width="100%" height="100%">
  <defs>
    <!-- 3D Drop Shadows -->
    <filter id="posterShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.2" />
    </filter>

    <filter id="embossBevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="-1" dy="-1" stdDeviation="0.5" flood-color="#FFF4D0" flood-opacity="0.9" />
      <feDropShadow dx="2" dy="2.5" stdDeviation="1" flood-color="#1A0C02" flood-opacity="0.85" />
    </filter>

    <filter id="deepCarve" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Parchment & Gold Gradients -->
    <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DEB3" />
      <stop offset="30%" stop-color="#EED8AE" />
      <stop offset="70%" stop-color="#DEBA7E" />
      <stop offset="100%" stop-color="#C79A52" />
    </linearGradient>

    <linearGradient id="woodFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3E2211" />
      <stop offset="50%" stop-color="#221107" />
      <stop offset="100%" stop-color="#120803" />
    </linearGradient>

    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="65%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <radialGradient id="waxSeal" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="40%" stop-color="#B91C1C" />
      <stop offset="80%" stop-color="#7F1D1D" />
      <stop offset="100%" stop-color="#450A0A" />
    </radialGradient>
  </defs>

  <!-- 3D Poster Container with Deep Drop Shadow -->
  <g filter="url(#posterShadow)">
    <!-- Outer Parchment -->
    <rect x="15" y="15" width="420" height="590" rx="8" fill="url(#parchmentGrad)" stroke="#8B5A2B" stroke-width="2" />
    
    <!-- 3D Inner Embossed Border -->
    <rect x="25" y="25" width="400" height="570" rx="6" fill="none" stroke="#8B4513" stroke-width="1.5" stroke-opacity="0.6" />
    <rect x="28" y="28" width="394" height="564" rx="5" fill="none" stroke="#FFF8DC" stroke-width="1" stroke-opacity="0.4" />

    <!-- Corner Rivets (3D Brass Studs) -->
    <circle cx="32" cy="32" r="4" fill="#D97706" stroke="#78350F" stroke-width="1" />
    <circle cx="418" cy="32" r="4" fill="#D97706" stroke="#78350F" stroke-width="1" />
    <circle cx="32" cy="588" r="4" fill="#D97706" stroke="#78350F" stroke-width="1" />
    <circle cx="418" cy="588" r="4" fill="#D97706" stroke="#78350F" stroke-width="1" />

    <!-- 1. 3D EMBOSSED "WANTED" HEADER -->
    <g filter="url(#embossBevel)">
      <text x="225" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="900" fill="#2B1808" letter-spacing="8">WANTED</text>
    </g>

    <!-- 2. PHOTO FRAME (Sunken Recessed 3D Window) -->
    <g filter="url(#deepCarve)">
      <rect x="45" y="115" width="360" height="270" fill="#1A1108" stroke="#653B18" stroke-width="4" rx="4" />
      
      <!-- Inner Frame Shadow -->
      <rect x="49" y="119" width="352" height="262" fill="#120B05" />

      <!-- Pirate Silhouette / Jolly Roger Graphic with Glow -->
      <!-- Skull -->
      <circle cx="225" cy="225" r="46" fill="#E5E7EB" stroke="#1F2937" stroke-width="3" filter="url(#embossBevel)" />
      <!-- Eye Sockets -->
      <ellipse cx="210" cy="228" rx="11" ry="14" fill="#111827" />
      <ellipse cx="240" cy="228" rx="11" ry="14" fill="#111827" />
      <!-- Glowing Eye (Future Skull) -->
      <circle cx="240" cy="228" r="4.5" fill="#F59E0B" filter="url(#goldGlow)" />
      <!-- Nose Hole -->
      <polygon points="225,238 221,248 229,248" fill="#111827" />
      <!-- Teeth -->
      <rect x="212" y="255" width="26" height="15" rx="2" fill="#E5E7EB" stroke="#1F2937" stroke-width="2" />
      <line x1="219" y1="255" x2="219" y2="270" stroke="#1F2937" stroke-width="2" />
      <line x1="225" y1="255" x2="225" y2="270" stroke="#1F2937" stroke-width="2" />
      <line x1="231" y1="255" x2="231" y2="270" stroke="#1F2937" stroke-width="2" />

      <!-- Straw Hat with 3D Emboss -->
      <path d="M165,198 C185,160 265,160 285,198 Z" fill="#FBBF24" stroke="#78350F" stroke-width="3" filter="url(#embossBevel)" />
      <path d="M150,198 C190,192 260,192 300,198 C305,202 295,206 225,206 C155,206 145,202 150,198 Z" fill="#F59E0B" stroke="#78350F" stroke-width="2.5" />
      <rect x="178" y="190" width="94" height="8" rx="2" fill="#DC2626" />

      <!-- Crossbones -->
      <path d="M170,165 L280,285 M280,165 L170,285" stroke="#D1D5DB" stroke-width="12" stroke-linecap="round" stroke-dasharray="" />

      <!-- Avatar Title Tag -->
      <rect x="90" y="340" width="270" height="30" rx="6" fill="#000000" fill-opacity="0.7" stroke="#F59E0B" stroke-width="1.2" />
      <text x="225" y="360" text-anchor="middle" font-family="ui-monospace, monospace" font-size="12" font-weight="bold" fill="#FCD34D">CAPTAIN OF CODE-CODE FLEET</text>
    </g>

    <!-- 3. DEAD OR ALIVE (3D Embossed Ribbon) -->
    <g filter="url(#embossBevel)">
      <text x="225" y="422" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#3B1F08" letter-spacing="4">DEAD OR ALIVE</text>
    </g>

    <!-- 4. NAME (KEERTHIVASAN R - 3D Embossed Heavy Serif) -->
    <g filter="url(#embossBevel)">
      <text x="225" y="475" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="900" fill="#220F03" letter-spacing="3">KEERTHIVASAN R</text>
    </g>

    <!-- 5. 3D EMBOSSED BOUNTY AMOUNT -->
    <g filter="url(#embossBevel)">
      <!-- Berries Symbol ₿ and Amount -->
      <text x="225" y="530" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="900" fill="url(#goldFoil)" letter-spacing="2">
        ₿ 100,000,000 -
      </text>
      <text x="225" y="552" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="bold" fill="#653B18" letter-spacing="4">EXPERIENCE REWARD (EXP)</text>
    </g>

    <!-- 6. 3D EMBOSSED RED WAX MARINE SEAL -->
    <g filter="url(#posterShadow)" transform="translate(345, 490)">
      <circle cx="35" cy="35" r="32" fill="url(#waxSeal)" stroke="#991B1B" stroke-width="2" />
      <circle cx="35" cy="35" r="26" fill="none" stroke="#FCA5A5" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="3,2" />
      <text x="35" y="33" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#FEF2F2">MARINE</text>
      <text x="35" y="47" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="bold" fill="#FCA5A5">VERIFIED</text>
    </g>

    <!-- Footer Stamp -->
    <text x="55" y="585" font-family="Georgia, serif" font-size="10" font-style="italic" fill="#78350F">GRAND LINE FLEET HQ // CODE-CODE LOGBOOK</text>
  </g>
</svg>