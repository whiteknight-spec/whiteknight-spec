<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" width="100%" height="100%">
  <defs>
    <!-- 3D Bevel & Emboss Filters -->
    <filter id="embossBevel" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1.5" dy="-1.5" stdDeviation="0.5" flood-color="#FFFBEB" flood-opacity="0.8" />
      <feDropShadow dx="2" dy="2.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="compassShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.3" />
    </filter>

    <!-- Metallic Brass & Gold Gradients -->
    <radialGradient id="brassRing" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#451A03" />
    </radialGradient>

    <linearGradient id="needleGradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <linearGradient id="needleGradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="848" height="348" rx="16" fill="#120d08" stroke="#F59E0B" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Section Header -->
  <text x="28" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="bold" fill="#FCD34D" letter-spacing="0.5">⚓ The Captain&apos;s Logbook</text>

  <!-- 3D EMBOSSED LOG POSE (COMPASS) & LUFFY'S STRAW HAT (Top Right) -->
  <g transform="translate(770, 52)" filter="url(#compassShadow)">
    <!-- Outer Brass Beveled Ring -->
    <circle cx="0" cy="0" r="32" fill="url(#brassRing)" stroke="#78350F" stroke-width="1.5" />
    <circle cx="0" cy="0" r="27" fill="#1C1007" stroke="#FBBF24" stroke-width="1" stroke-opacity="0.7" />
    
    <!-- Compass Cardinal Ticks -->
    <line x1="0" y1="-25" x2="0" y2="-20" stroke="#F59E0B" stroke-width="1.5" />
    <line x1="0" y1="20" x2="0" y2="25" stroke="#F59E0B" stroke-width="1.5" />
    <line x1="-25" y1="0" x2="-20" y2="0" stroke="#F59E0B" stroke-width="1.5" />
    <line x1="20" y1="0" x2="25" y2="0" stroke="#F59E0B" stroke-width="1.5" />
    <text x="0" y="-14" text-anchor="middle" font-family="Georgia, serif" font-size="7" font-weight="bold" fill="#FDE68A">N</text>

    <!-- 3D Compass Needle (Pointing to Laugh Tale) -->
    <g transform="rotate(35)">
      <polygon points="0,-23 5,0 0,-3" fill="url(#needleGradRed)" filter="url(#embossBevel)" />
      <polygon points="0,-23 -5,0 0,-3" fill="#B91C1C" />
      <polygon points="0,23 5,0 0,3" fill="url(#needleGradGold)" filter="url(#embossBevel)" />
      <polygon points="0,23 -5,0 0,3" fill="#92400E" />
      <!-- Center Pivot Brass Rivet -->
      <circle cx="0" cy="0" r="4" fill="url(#brassRing)" stroke="#451A03" stroke-width="0.8" />
    </g>

    <!-- Glass Dome Reflection Curve -->
    <path d="M-24,-8 A26,26 0 0,1 24,-8 A27,15 0 0,0 -24,-8 Z" fill="url(#glassReflection)" />

    <!-- 3D Embossed Straw Hat perched on the compass -->
    <g transform="translate(0, -32)" filter="url(#embossBevel)">
      <!-- Crown -->
      <path d="M-14,6 C-14,-6 14,-6 14,6 Z" fill="#FBBF24" stroke="#78350F" stroke-width="1" />
      <rect x="-13" y="3" width="26" height="3" fill="#DC2626" />
      <!-- Brim -->
      <ellipse cx="0" cy="6" rx="22" ry="4" fill="#F59E0B" stroke="#78350F" stroke-width="1" />
    </g>
  </g>

  <!-- Bio Paragraph -->
  <text x="28" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#CBD5E1">
    <tspan>I&apos;m </tspan>
    <tspan fill="#FDE68A" font-weight="bold">Keerthivasan R</tspan>
    <tspan>, an </tspan>
    <tspan fill="#FCD34D" font-weight="bold">Electrical &amp; Electronics Engineering (EEE)</tspan>
    <tspan> graduate who set sail from the</tspan>
    <tspan x="28" dy="22">hardware circuits realm into the expansive seas of </tspan>
    <tspan fill="#FCD34D" font-weight="bold">Software Development &amp; AI Architecture</tspan>
    <tspan>.</tspan>
  </text>

  <!-- Blockquote Box -->
  <rect x="28" y="116" width="794" height="62" rx="4" fill="#451a03" fill-opacity="0.3" />
  <rect x="28" y="116" width="4" height="62" rx="2" fill="#F59E0B" />
  <text x="42" y="139" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13.5" fill="#FCD34D">
    <tspan>&quot;Inherited will, the flow of time, and the dreams of its people—these are things that cannot be stopped.</tspan>
    <tspan x="42" dy="20">As long as developers continue to seek the essence of code, their voyage will never end!&quot;</tspan>
  </text>

  <!-- Bullet 1: The Grand Voyage -->
  <text x="28" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
    <tspan fill="#FCD34D" font-weight="bold">🌊 The Grand Voyage: </tspan>
    <tspan fill="#CBD5E1">Building cross-platform mobile apps with Flutter, engineering scalable Python backends,</tspan>
    <tspan x="54" dy="19" fill="#CBD5E1">and crafting intelligent AI automation workflows.</tspan>
  </text>

  <!-- Bullet 2: Devil Fruit -->
  <text x="28" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
    <tspan fill="#FCD34D" font-weight="bold">🍈 Devil Fruit: </tspan>
    <tspan fill="#FDE68A" font-style="italic">Code-Code Fruit (Model: AI Engineering) </tspan>
    <tspan fill="#CBD5E1">— Turns abstract logic into high-impact systems.</tspan>
  </text>

  <!-- Bullet 3: Log Pose Focus -->
  <text x="28" y="285" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
    <tspan fill="#FCD34D" font-weight="bold">🧭 Log Pose Focus: </tspan>
    <tspan fill="#CBD5E1">Autonomous AI Agents, Large Language Models (LLM), and resilient architectures.</tspan>
  </text>

  <!-- Bullet 4: Crew Alliances -->
  <text x="28" y="315" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
    <tspan fill="#FCD34D" font-weight="bold">🤝 Crew Alliances: </tspan>
    <tspan fill="#CBD5E1">Open to joining high-impact engineering crews, product teams, and AI ventures.</tspan>
  </text>
</svg>